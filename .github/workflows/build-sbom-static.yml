# SBOM knihovny – statická verze bez JavaScriptu.
# Celý generátor je přímo v tomto workflow: jen bash + jq (obojí je na ubuntu runneru předinstalované).
# Žádný Node, žádný Python, žádné skripty v repu. Prohlížeč dostane čisté HTML + CSS.
name: Build static SBOM pages & deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/SBOM-spdx-reports/**'
      - 'docs/SBOM-cyclonedx-reports/**'
      - 'docs/sbom-sources.json'
      - 'docs/style2.css'
      - '.github/workflows/build-sbom-static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OUT: _site   # výstupní složka (necommituje se, vzniká jen v běhu)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ------------------------------------------------------------------
      # 1) jq programy se zapíšou do dočasné složky runneru (ne do repa)
      # ------------------------------------------------------------------
      - name: Připrav jq programy
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP:-/tmp}/sbom"; mkdir -p "$W"
          jq --version

          # ---------- parse.jq: SBOMy (SPDX + CycloneDX) -> jednotný model ----------
          cat > "$W/parse.jq" <<'JQ'
          def truthy: . != null and . != false and . != "";
          def nz: select(truthy);
          def str: if . == null then "" elif type == "string" then . else tostring end;
          def arr: if type == "array" then . else [] end;
          def trim_: sub("^\\s+"; "") | sub("\\s+$"; "");
          def uniqk: reduce .[] as $x ([]; if ($x | truthy) and (any(.[]; . == $x) | not) then . + [$x] else . end);

          # %XX dekódování (ASCII znaky; vícebajtové UTF-8 sekvence nechá zakódované)
          def hexval: ascii_downcase | explode | reduce .[] as $c (0; . * 16 + (if $c >= 97 then $c - 87 else $c - 48 end));
          def pdec: if type != "string" then "" else
            [match("%[0-9A-Fa-f]{2}|[^%]+|%"; "g").string]
            | map(if test("^%[0-9A-Fa-f]{2}$") then ((.[1:] | hexval) as $v | if $v < 128 then ([$v] | implode) else . end) else . end)
            | join("") end;

          # pkg:type/namespace/name@version?qualifiers#subpath
          def parse_purl:
            if type == "string" and startswith("pkg:") then
              ((.[4:] | split("#")[0] // "") | split("?")[0] // "") as $s0
              | (if ($s0 | test("^[^/]*/.*@")) or (($s0 | test("/") | not) and ($s0 | test("@")))
                 then ($s0 | capture("^(?<a>.*)@(?<v>[^@]*)$") | [.a, .v]) else [$s0, ""] end) as [$s, $ver]
              | ($s | split("/") | map(select(. != ""))) as $p
              | { type: (($p[0] // "") | ascii_downcase),
                  name: (($p[1:] | last // "") | pdec),
                  namespace: ($p[1:-1] | map(pdec) | join("/")),
                  version: ($ver | pdec) }
            else null end;
          def display_name:
            if .namespace == "" then .name elif .type == "maven" then "\(.namespace):\(.name)" else "\(.namespace)/\(.name)" end;

          def component($name; $version; $purl; $lic; $sbom):
            ($purl | parse_purl) as $p
            | ($name | str) as $nm
            | (if $p then ($p | display_name) else $nm end) as $n0
            | (if ($p == null) and ($n0 | test("^[a-z]+:"; "i")) and (($n0 | contains("/")) | not)
               then ($n0 | sub("^[a-z]+:"; ""; "i")) else $n0 end) as $n1      # "npm:express" -> "express"
            | { name: (if $n1 != "" then $n1 elif $nm != "" then $nm else "(bez názvu)" end),
                version: (($version | str | nz) // ($p.version | nz) // ""),
                purl: ($purl | str),
                ecosystem: ($p.type // ""),
                licenses: ($lic | map(str) | uniqk),
                sbom: $sbom };

          # ---- původ SBOMu (repo / zdroj) ----
          def mk($host; $owner; $repo):
            ($repo | sub("\\.git$"; ""; "i")) as $r
            | if $owner == "" or $r == "" then null
              else { repo: "\($owner)/\($r)", repoUrl: "https://\($host)/\($owner)/\($r)", host: $host } end;
          def repo_from_string:
            if type != "string" or . == "" then null else
              trim_
              | if test("^pkg:github/[^/@?#]+/[^/@?#]+"; "i") then                     # pkg:github/OWNER/REPO@ref
                  capture("^pkg:github/(?<o>[^/@?#]+)/(?<r>[^/@?#]+)"; "i") | mk("github.com"; .o; .r)
                elif test("^com\\.github\\.[^/\\s]+/[^/\\s@]+$"; "i") then              # com.github.OWNER/REPO (GitHub export)
                  capture("^com\\.github\\.(?<o>[^/\\s]+)/(?<r>[^/\\s@]+)$"; "i") | mk("github.com"; .o; .r)
                elif test("^(?:ssh://)?git@[^/:]+[:/][^/]+/[^/#?\\s]+"; "i") then       # git@host:OWNER/REPO(.git)
                  capture("^(?:ssh://)?git@(?<h>[^/:]+)[:/](?<o>[^/]+)/(?<r>[^/#?\\s]+)"; "i") | mk(.h; .o; .r)
                elif test("^(?:git\\+)?(?:https?|git)://(?:[^@/]+@)?[^/:]+(?::\\d+)?/[^/#?\\s]+/[^/#?\\s]+"; "i") then
                  capture("^(?:git\\+)?(?:https?|git)://(?:[^@/]+@)?(?<h>[^/:]+)(?::\\d+)?/(?<o>[^/#?\\s]+)/(?<r>[^/#?\\s]+)"; "i")
                  | (.h | ascii_downcase) as $h | (.o | ascii_downcase) as $ol
                  | if $h == "spdx.org" or $h == "cyclonedx.org" then null
                    elif ($h | test("^(www\\.)?github\\.com$")) and ($ol | IN("orgs", "sponsors", "apps", "marketplace")) then null
                    else mk($h | sub("^www\\."; ""); .o; .r) end
                else null end
            end;
          # první nalezené repo z kandidátů; preferuje github hosty, pak cokoliv "git-like"
          def first_repo:
            [.[] | repo_from_string | select(. != null)] as $f
            | first($f[] | select(.host | test("(^|\\.)github\\.com$|\\.ghe\\.com$"))) // first($f[] | select(.host | test("git"))) // null;

          def purls: (.externalRefs | arr) | map(select(((.referenceType // "") | str | ascii_downcase) == "purl") | .referenceLocator | str);

          def parse_spdx($id):
            . as $d
            | ($d.packages | arr) as $pkgs
            | (($d.documentDescribes | arr)
               + [ $d.relationships | arr | .[]
                   | if .relationshipType == "DESCRIBES" and .spdxElementId == $d.SPDXID then .relatedSpdxElement
                     elif .relationshipType == "DESCRIBED_BY" and .relatedSpdxElement == $d.SPDXID then .spdxElementId
                     else empty end ]) as $root
            | ((first($pkgs[] | select(.SPDXID as $s | $root | any(.[]; . == $s)))) // null) as $rp
            | [ $pkgs[] | select(.SPDXID as $s | $root | any(.[]; . == $s) | not)
                | ((purls | .[0]) // "") as $purl
                | [ .licenseConcluded, .licenseDeclared | select(type == "string" and (trim_ | IN("", "NOASSERTION", "NONE") | not)) ] as $lic
                | component(.name; .versionInfo; $purl; $lic[:1]; $id) ] as $comps
            | ((($rp.name | nz) // ($d.name | nz) // "") | str) as $name
            | ([ (($rp // {}) | purls[]), $rp.name, $d.name, $rp.downloadLocation, $rp.homepage,
                 # starší GitHub exporty: https://github.com/OWNER/REPO/dependency_graph/sbom-xxxx
                 (if ($d.documentNamespace | type) == "string" and ($d.documentNamespace | test("/dependency_graph/")) then $d.documentNamespace else null end)
               ] | first_repo) as $origin
            | [ ($d.creationInfo.creators | arr | .[]) | select(type == "string" and test("^Tool:"; "i")) | sub("^Tool:\\s*"; ""; "i") ] as $tools
            | (($name | sub("^com\\.github\\."; ""; "i"))
               + (if ($rp.versionInfo | truthy) and $rp.versionInfo != "NOASSERTION" then "@\($rp.versionInfo)" else "" end)) as $label
            | { name: $name, created: ($d.creationInfo.created | str), comps: $comps, origin: $origin, tools: $tools, label: $label, serial: "" };

          def cdx_lic: [ arr | .[] | if (.expression | truthy) then .expression elif .license then (.license.id // .license.name) else empty end ];

          def parse_cdx($id):
            . as $d
            | $d.metadata.component as $m
            | ($m["bom-ref"]) as $rr
            | def cwalk: arr | .[]
                | ( (if ($rr | truthy) then .["bom-ref"] == $rr else ($m != null and .name == $m.name and .version == $m.version) end) as $isroot
                    | if $isroot then empty
                      else component(if (.group | truthy) and ((.purl | truthy) | not) then "\(.group)/\(.name)" else .name end;
                                     .version; .purl; (.licenses | cdx_lic); $id) end ),
                  (.components | cwalk);
              [ $d.components | cwalk ] as $comps
            | (if $m then ([$m.group, $m.name] | map(select(truthy) | str) | join("/")) + (if ($m.version | truthy) then "@\($m.version)" else "" end) else "" end) as $name
            | ($m.externalReferences | arr) as $refs
            | def bytype($t): [ $refs[] | select(.type == $t) | .url ];
              ($d.metadata.properties | arr) as $props
            | [ $props[] | select((.name | str) | test("repo|vcs|scm|source|git"; "i")) | .value ] as $pv
            | (first($props[] | select((.name | str) | test("^(github:repository|github\\.repository|repository)$"; "i")) | .value) // null) as $gh
            | (bytype("vcs")
               + [ $m.purl, (if ($gh | type) == "string" and ($gh | test("^[^/\\s]+/[^/\\s]+$")) then "https://github.com/\($gh)" else null end) ]
               + $pv + bytype("website") + bytype("distribution") | first_repo) as $origin
            | $d.metadata.tools as $t
            | (if ($t | type) == "array" then $t else (($t.components | arr) + ($t.services | arr)) end) as $tl
            | [ $tl[] | [ ((.vendor | nz) // (.group | nz) // (.publisher | nz) // null), .name, .version ]
                | map(select(truthy) | str) | join(" ") | select(. != "") ] as $tools
            | { name: $name, created: ($d.metadata.timestamp | str), comps: $comps, origin: $origin, tools: $tools, label: $name, serial: ($d.serialNumber | str) };

          def detect:
            (if (.sbom | type) == "object" then .sbom else . end) as $r       # GitHub export má obal {"sbom": {...}}
            | if ($r.spdxVersion | truthy) or ($r.SPDXID | truthy) then ["SPDX", $r]
              elif $r.bomFormat == "CycloneDX" or (($r.specVersion | truthy) and ($r.components | truthy)) then ["CycloneDX", $r]
              else [null, $r] end;

          def resolve_origin($rel; $ovr):
            ((.origin.repo // "") | str) as $repo0 | ((.origin.repoUrl // "") | str) as $url0
            | (if .origin then "sbom" elif (.label | truthy) then "sbom-name" else "file" end) as $src0
            | (if $ovr then
                 ((if ($ovr.repo | truthy) then (($ovr.repo | str | repo_from_string) // ("https://github.com/\($ovr.repo)" | repo_from_string)) else null end) as $o
                  | (if $o then [$o.repo, $o.repoUrl] else [$repo0, $url0] end)
                  | if ($ovr.url | truthy)
                    then [ (if .[0] == "" then ((($ovr.url | str | repo_from_string) // {}).repo // "") else .[0] end), ($ovr.url | str) ]
                    else . end
                  | . + ["sbom-sources.json"])
               else [$repo0, $url0, $src0] end) as [$repo, $url, $src]
            | ($rel | split("/") | last) as $base
            | { repo: $repo, repoUrl: $url, originSource: $src,
                sourceLabel: (($ovr.label | nz | str) // ($repo | nz) // (.label | nz) // ($base | sub("\\.json$"; ""; "i"))) };

          def dd($seen): if (. as $c | any($seen[]; . == $c)) then (. + "_" | dd($seen)) else . end;

          # ---- hlavní část: vstupy = soubory předané na příkazové řádce ----
          (($ov[0] // {}) | if type == "object" then
              [ to_entries[] | select((.key | startswith("_") | not) and (.value | type) == "object") | .key |= sub("^/?(docs/)?"; "") ] | from_entries
            else {} end) as $ovs
          | reduce (inputs | {file: input_filename, raw: .}) as $in
              ({ sboms: [], components: [], seen: [],
                 log: (if ($ovs | length) > 0 then ["✓ docs/sbom-sources.json: \($ovs | length) záznamů"] else [] end) };
              ($in.file | sub("^(\\./)?docs/"; "")) as $rel
              | ($rel | split("/")[0] | if test("spdx"; "i") then "SPDX" else "CycloneDX" end) as $hint
              | (try ($in.raw | detect) catch [null, null]) as [$fmt, $doc]
              | if $fmt == null then .log += ["! Přeskakuji \($rel): neznámý formát SBOM"]
                else
                  . as $st
                  | (($rel | sub("^SBOM-(?<x>[^/]+)-reports/"; "\(.x)/"; "i") | sub("\\.json$"; ""; "i")) | dd($st.seen)) as $id
                  | (try (if $fmt == "SPDX" then ($doc | parse_spdx($id)) else ($doc | parse_cdx($id)) end) catch {err: (. | tostring)}) as $r
                  | if $r.err then .log += ["! Přeskakuji \($rel): chyba při zpracování (\($r.err))"]
                    else
                      ($rel | split("/") | last) as $base
                      | ($r | resolve_origin($rel; ($ovs[$rel] // $ovs[$base]))) as $o
                      | .seen += [$id]
                      | .sboms += [{ id: $id, file: $rel, format: $fmt,
                                     name: (($r.name | nz) // ($base | sub("\\.json$"; ""; "i"))),
                                     created: $r.created, componentCount: ($r.comps | length),
                                     repo: $o.repo, repoUrl: $o.repoUrl, sourceLabel: $o.sourceLabel, originSource: $o.originSource,
                                     tool: ($r.tools | map(str) | join(", ")), serialNumber: $r.serial }]
                      | .components += $r.comps
                      | .log += ((if $fmt != $hint then ["! \($rel): formát \($fmt) je ve složce pro \($hint)"] else [] end)
                                 + ["✓ \($rel) (\($fmt)): \($r.comps | length) komponent, původ: \(($o.repo | nz) // $o.sourceLabel) [\($o.originSource)]"])
                    end
                end)
          | { generatedAt: $now, sboms, components, log }
          JQ

          # ---------- render.jq: model -> HTML stránky + CSV (výstup: jeden JSON {path, content} na řádek) ----------
          cat > "$W/render.jq" <<'JQ'
          def truthy: . != null and . != false and . != "";
          def nz: select(truthy);
          def h: if . == null then "" else tostring | @html end;              # HTML escape všeho
          def furl: split("/") | map(@uri) | join("/");                        # relativní cesta k souboru
          def safeurl: if type == "string" and test("^https?://"; "i") then . else "" end;
          def uniqk: reduce .[] as $x ([]; if ($x | truthy) and (any(.[]; . == $x) | not) then . + [$x] else . end);
          def slugify: ascii_downcase | gsub("[^a-z0-9._-]+"; "-") | gsub("^[-.]+|-+$"; "") | if . == "" then "x" else . end;
          def dedupe_slugs: reduce .[] as $s ({out: [], used: {}};
              ($s | slugify) as $b
              | (if .used[$b] then "\($b)-\(.used[$b] + 1)" else $b end) as $sl
              | .used[$b] = ((.used[$b] // 0) + 1) | .used[$sl] = (.used[$sl] // 1) | .out += [$sl]) | .out;
          def eslug: if . == "" then "nezname" else slugify end;
          def fmtdate: if type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}")
            then .[0:10] + " " + .[11:16] + (if test("Z$") then " UTC" else "" end) else (. // "" | tostring) end;
          def letter: (.name | ascii_upcase | .[0:1]) as $c | if ($c | test("^[A-Z]$")) then $c else "#" end;
          def lid: if . == "#" then "L-0" else "L-\(.)" end;
          def libkey: [(.ecosystem // "" | ascii_downcase), (.name | ascii_downcase), (.version // "")] | join("|");
          def libsort: sort_by((if letter == "#" then 0 else 1 end), (.name | ascii_downcase), .version, .ecosystem);
          def group_libs: group_by(libkey)
            | map({ name: .[0].name, version: .[0].version, ecosystem: (.[0].ecosystem // ""),
                    licenses: ([.[].licenses[]?] | uniqk), purls: ([.[].purl] | uniqk), sboms: ([.[].sbom] | uniqk) })
            | libsort;
          def badge: "<span class=\"badge \(. | h)\">\(. | h)</span>";
          def muted($t): "<span class=\"muted\">\($t | h)</span>";

          . as $M
          | ([$M.sboms[].id] | dedupe_slugs) as $sslugs
          | ($M.sboms | to_entries | map(.value + { slug: $sslugs[.key], okey: ((.value.repo | nz) // "unknown") })) as $S
          | ($S | map({key: .id, value: .}) | from_entries) as $byId
          | ($S | map(.okey) | uniqk | sort_by(if . == "unknown" then "~" else ascii_downcase end)) as $okeys
          | ($okeys | dedupe_slugs) as $oslugs
          | ([range(0; $okeys | length) | {key: $okeys[.], value: $oslugs[.]}] | from_entries) as $oslug
          | ($M.components | map(.ecosystem // "") | unique) as $ecos
          | ($M.components | group_libs) as $libs

          # ---- společné kusy HTML ----
          | def page($title; $root; $body):
              "<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n"
              + "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n"
              + "<meta name=\"robots\" content=\"noindex, nofollow\">\n"
              + "<title>\($title | h) – SBOM knihovny</title>\n<link rel=\"stylesheet\" href=\"\($root)style2.css\">\n</head>\n<body>\n"
              + "<nav class=\"top\"><a class=\"brand\" href=\"\($root)index.html\">SBOM knihovny</a>"
              + "<a href=\"\($root)index.html#knihovny\">Knihovny</a><a href=\"\($root)index.html#sbomy\">SBOMy</a>"
              + "<a href=\"\($root)index.html#repa\">Repa</a><a href=\"\($root)index.html#ekosystemy\">Ekosystémy</a>"
              + "<a href=\"\($root)libraries.csv\" download>CSV</a></nav>\n"
              + $body
              + "\n<footer>Vygenerováno \($M.generatedAt | h) · statické HTML bez JavaScriptu · hledání: Ctrl+F (⌘F)</footer>\n</body>\n</html>\n";
            def repo_link($s; $root):
              if ($s.repo | truthy) then
                "<a href=\"\($root)repo/\($oslug[$s.okey]).html\">\($s.repo | h)</a>"
                + (($s.repoUrl | safeurl) as $u | if $u != "" then " <a class=\"ext\" href=\"\($u | h)\" title=\"\($u | h)\" rel=\"noopener noreferrer\">↗</a>" else "" end)
              else "<span class=\"nolink\">unknown</span>" end
              + (if ($s.sourceLabel | truthy) and $s.sourceLabel != $s.repo then " " + muted("(" + $s.sourceLabel + ")") else "" end);
            def file_links($s; $root):
              "<a href=\"\($root)sbom/\($s.slug).html\">\($s.name | h)</a> · <a href=\"\($root)\($s.file | furl)\">\($s.file | split("/") | last | h)</a>";
            def origin_html($s; $root):
              "<div class=\"origin\">\($s.format | badge) \(repo_link($s; $root))<div class=\"file\">\(file_links($s; $root))</div></div>";
            def eco_link($e; $root):
              if $e == "" then muted("–") else "<a href=\"\($root)ecosystem/\($e | eslug).html\">\($e | h)</a>" end;
            def lib_table($rows; $root; $letters):
              "<div class=\"tablewrap\"><table class=\"libs\"><thead><tr><th>Knihovna</th><th>Verze</th><th>Ekosystém</th><th>Licence</th>"
              + "<th>Původ (repo) / SBOM soubor</th><th class=\"num\">SBOMů</th></tr></thead><tbody>\n"
              + ([ range(0; $rows | length) as $i | $rows[$i] as $r
                   | (if $letters and ($i == 0 or (($rows[$i - 1] | letter) != ($r | letter)))
                      then "<tr class=\"letter\" id=\"\($r | letter | lid)\"><th colspan=\"6\">\($r | letter | h)</th></tr>\n" else "" end)
                     + "<tr><td class=\"name\">\($r.name | h)"
                     + (if ($r.purls | length) > 0 then "<div class=\"purl\">\($r.purls | map(h) | join("<br>"))</div>" else "" end) + "</td>"
                     + "<td>\(if ($r.version | truthy) then ($r.version | h) else muted("–") end)</td>"
                     + "<td>\(eco_link($r.ecosystem; $root))</td>"
                     + "<td>\(if ($r.licenses | length) > 0 then ($r.licenses | map(tostring) | join(", ") | h) else muted("neuvedeno") end)</td>"
                     + "<td>\([ $r.sboms[] | $byId[.] | select(. != null) | origin_html(.; $root) ] | join(""))</td>"
                     + "<td class=\"num\">\($r.sboms | length)</td></tr>\n" ] | join(""))
              + (if ($rows | length) == 0 then "<tr><td colspan=\"6\" class=\"muted\">Žádné knihovny.</td></tr>" else "" end)
              + "</tbody></table></div>";
            def sbom_table($list; $root):
              "<div class=\"tablewrap\"><table><thead><tr><th>SBOM / soubor</th><th>Formát</th><th>Původ (repo)</th><th>Nástroj</th>"
              + "<th>Datum</th><th class=\"num\">Komponent</th></tr></thead><tbody>\n"
              + ([ $list[] | . as $s
                   | "<tr><td><a href=\"\($root)sbom/\($s.slug).html\">\($s.name | h)</a><div class=\"file\"><a href=\"\($root)\($s.file | furl)\">\($s.file | h)</a></div></td>"
                     + "<td>\($s.format | badge)</td><td>\(repo_link($s; $root))"
                     + (if $s.originSource == "sbom-sources.json" then " " + muted("(ručně)") else "" end) + "</td>"
                     + "<td>\(if ($s.tool | truthy) then ($s.tool | h) else muted("–") end)</td>"
                     + "<td>\($s.created | fmtdate | h)</td><td class=\"num\">\($s.componentCount)</td></tr>\n" ] | join(""))
              + (if ($list | length) == 0 then "<tr><td colspan=\"6\" class=\"muted\">Žádné SBOMy – nahraj JSON do docs/SBOM-spdx-reports/ nebo docs/SBOM-cyclonedx-reports/.</td></tr>" else "" end)
              + "</tbody></table></div>";
            def stat($n; $label): "<div class=\"stat\"><b>\($n)</b><span>\($label | h)</span></div>";

          # ---- index.html ----
            ($libs | map(letter) | unique) as $letters
          | ($S | map(.repo | nz) | unique | length) as $nrepo
          | { path: "index.html", content: page("Přehled"; "";
              "<header><div><h1>SBOM knihovny</h1><p class=\"sub\">Použité knihovny napříč SPDX a CycloneDX SBOMy · hledej pomocí Ctrl+F (⌘F)</p></div>"
              + "<div class=\"stats\">" + stat($S | length; "SBOMů") + stat($M.components | length; "komponent")
              + stat($libs | length; "unikátních knihoven") + stat($nrepo; "repo") + stat($ecos | map(select(. != "")) | length; "ekosystémů") + "</div></header>\n<main>\n"
              + "<nav class=\"az\" aria-label=\"Rejstřík A–Z\">"
              + ([ ("#", ("ABCDEFGHIJKLMNOPQRSTUVWXYZ" | split("")[])) as $c
                   | if any($letters[]; . == $c) then "<a href=\"#\($c | lid)\">\($c | h)</a>" else "<span>\($c | h)</span>" end ] | join(""))
              + "</nav>\n"
              + "<section id=\"knihovny\"><h2>Knihovny <span class=\"muted\">(\($libs | length) – stejná knihovna + verze ve více SBOMech = jeden řádek)</span></h2>"
              + "<p class=\"hint\">Stáhnout vše jako <a href=\"libraries.csv\" download>CSV</a>. Filtrování: rejstřík nahoře, stránky jednotlivých "
              + "<a href=\"#sbomy\">SBOMů</a>, <a href=\"#repa\">rep</a> a <a href=\"#ekosystemy\">ekosystémů</a>.</p>"
              + lib_table($libs; ""; true) + "</section>\n"
              + "<section id=\"sbomy\"><h2>Načtené SBOMy <span class=\"muted\">(\($S | length))</span></h2>" + sbom_table($S; "") + "</section>\n"
              + "<section id=\"repa\"><h2>Repa / původ <span class=\"muted\">(\($okeys | length))</span></h2><div class=\"tablewrap\"><table><thead><tr>"
              + "<th>Repo</th><th>Odkaz</th><th class=\"num\">SBOMů</th><th class=\"num\">Unikátních knihoven</th></tr></thead><tbody>\n"
              + ([ $okeys[] as $k | [ $S[] | select(.okey == $k) ] as $ss | ($ss | map(.id)) as $ids
                   | ([ $M.components[] | select(.sbom as $x | any($ids[]; . == $x)) ] | group_by(libkey) | length) as $nl
                   | ($ss[0].repoUrl | safeurl) as $u
                   | "<tr><td><a href=\"repo/\($oslug[$k]).html\">\($k | h)</a></td><td>"
                     + (if $k != "unknown" and $u != "" then "<a class=\"ext\" href=\"\($u | h)\" rel=\"noopener noreferrer\">\($u | h)</a>" else muted("–") end)
                     + "</td><td class=\"num\">\($ss | length)</td><td class=\"num\">\($nl)</td></tr>\n" ] | join(""))
              + "</tbody></table></div></section>\n"
              + "<section id=\"ekosystemy\"><h2>Ekosystémy</h2><ul class=\"chips\">"
              + ([ $ecos[] as $e | ([ $libs[] | select(.ecosystem == $e) ] | length) as $n
                   | "<li><a href=\"ecosystem/\($e | eslug).html\">\(if $e == "" then "neuvedeno" else ($e | h) end)</a> <span class=\"muted\">\($n)</span></li>" ] | join(""))
              + "</ul></section>\n</main>") }

          # ---- sbom/<slug>.html ----
          , ( $S[] as $s
              | ([ $M.components[] | select(.sbom == $s.id) ] | libsort) as $cs
              | { path: "sbom/\($s.slug).html", content: page($s.name; "../";
                  "<header><div><p class=\"crumbs\"><a href=\"../index.html#sbomy\">SBOMy</a> /</p><h1>\($s.name | h) \($s.format | badge)</h1></div></header>\n<main>\n"
                  + "<dl class=\"meta\"><dt>Soubor</dt><dd><a href=\"../\($s.file | furl)\">\($s.file | h)</a></dd>"
                  + "<dt>Původ (repo)</dt><dd>\(repo_link($s; "../"))</dd>"
                  + "<dt>Zdroj informace o původu</dt><dd>\($s.originSource | h)</dd>"
                  + "<dt>Nástroj</dt><dd>\(if ($s.tool | truthy) then ($s.tool | h) else "–" end)</dd>"
                  + "<dt>Datum</dt><dd>\($s.created | fmtdate | h)</dd>"
                  + "<dt>Komponent</dt><dd>\($s.componentCount)</dd>"
                  + (if ($s.serialNumber | truthy) then "<dt>Serial</dt><dd><code>\($s.serialNumber | h)</code></dd>" else "" end) + "</dl>\n"
                  + "<div class=\"tablewrap\"><table><thead><tr><th>Knihovna</th><th>Verze</th><th>Ekosystém</th><th>Licence</th><th>purl</th></tr></thead><tbody>\n"
                  + ([ $cs[] | "<tr><td class=\"name\">\(.name | h)</td><td>\(.version | h)</td><td>\(eco_link(.ecosystem // ""; "../"))</td>"
                       + "<td>\(if (.licenses | length) > 0 then (.licenses | join(", ") | h) else muted("neuvedeno") end)</td>"
                       + "<td class=\"purl\">\(.purl | h)</td></tr>\n" ] | join(""))
                  + (if ($cs | length) == 0 then "<tr><td colspan=\"5\" class=\"muted\">Žádné komponenty.</td></tr>" else "" end)
                  + "</tbody></table></div>\n</main>") } )

          # ---- repo/<slug>.html ----
          , ( $okeys[] as $k
              | [ $S[] | select(.okey == $k) ] as $ss | ($ss | map(.id)) as $ids
              | ($ss[0].repoUrl | safeurl) as $u
              | { path: "repo/\($oslug[$k]).html", content: page($k; "../";
                  "<header><div><p class=\"crumbs\"><a href=\"../index.html#repa\">Repa</a> /</p><h1>\($k | h)</h1>"
                  + (if $k != "unknown" and $u != "" then "<p class=\"sub\"><a class=\"ext\" href=\"\($u | h)\" rel=\"noopener noreferrer\">\($u | h) ↗</a></p>"
                     elif $k == "unknown" then "<p class=\"sub\">SBOMy, u kterých se repo nepodařilo zjistit (doplň ho v docs/sbom-sources.json).</p>" else "" end)
                  + "</div></header>\n<main>\n<section><h2>SBOMy</h2>" + sbom_table($ss; "../") + "</section>\n"
                  + "<section><h2>Knihovny</h2>"
                  + lib_table([ $M.components[] | select(.sbom as $x | any($ids[]; . == $x)) ] | group_libs; "../"; false)
                  + "</section>\n</main>") } )

          # ---- ecosystem/<name>.html ----
          , ( $ecos[] as $e
              | { path: "ecosystem/\($e | eslug).html", content: page("Ekosystém " + (if $e == "" then "neuvedeno" else $e end); "../";
                  "<header><div><p class=\"crumbs\"><a href=\"../index.html#ekosystemy\">Ekosystémy</a> /</p><h1>\(if $e == "" then "neuvedeno" else ($e | h) end)</h1></div></header>\n<main>\n"
                  + lib_table([ $libs[] | select(.ecosystem == $e) ]; "../"; false) + "\n</main>") } )

          # ---- libraries.csv (UTF-8 s BOM kvůli Excelu, CRLF) ----
          , { path: "libraries.csv", content: ("\ufeff" + ((
                [["library", "version", "ecosystem", "license", "purl", "sbom_count", "origins", "repo_urls", "sbom_names", "sbom_files"]]
                + [ $libs[] | . as $r | [ $r.sboms[] | $byId[.] | select(. != null) ] as $ss
                    | [ $r.name, $r.version, $r.ecosystem, ($r.licenses | map(tostring) | join(", ")), ($r.purls | join(" ")), ($r.sboms | length),
                        ($ss | map((.repo | nz) // (.sourceLabel | nz) // .name) | join("; ")), ($ss | map(.repoUrl // "") | join("; ")),
                        ($ss | map(.name) | join("; ")), ($ss | map(.file) | join("; ")) ] ]
              ) | map(@csv) | join("\r\n")) + "\r\n") }
          JQ
          echo "jq programy připraveny v $W"

      # ------------------------------------------------------------------
      # 2) Načtení SBOMů -> model.json (neplatné soubory se přeskočí s varováním)
      # ------------------------------------------------------------------
      - name: Načti SBOMy
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP:-/tmp}/sbom"
          rm -rf "$OUT"; mkdir -p "$OUT"

          # volitelné ruční doplnění původu
          echo '{}' > "$W/sources.json"
          if [ -f docs/sbom-sources.json ]; then
            if jq -e 'type == "object"' docs/sbom-sources.json > /dev/null 2>&1; then
              cp docs/sbom-sources.json "$W/sources.json"
            else
              echo "::warning file=docs/sbom-sources.json::docs/sbom-sources.json je neplatný JSON – ignoruji"
            fi
          fi

          # najdi SBOMy, ověř JSON a zkopíruj je do výstupu (kvůli odkazům na zdrojový soubor)
          files=()
          for d in docs/SBOM-spdx-reports docs/SBOM-cyclonedx-reports; do
            [ -d "$d" ] || continue
            while IFS= read -r -d '' f; do
              if jq -e -s 'length == 1 and (.[0] | type) == "object"' "$f" > /dev/null 2>&1; then
                files+=("$f")
                rel="${f#docs/}"
                mkdir -p "$OUT/$(dirname "$rel")"
                cp "$f" "$OUT/$rel"
              else
                echo "::warning file=$f::Přeskakuji $f: neplatný JSON"
              fi
            done < <(find "$d" -type f -iname '*.json' -print0 | LC_ALL=C sort -z)
          done

          jq -n --slurpfile ov "$W/sources.json" \
                --arg now "$(TZ=Europe/Prague date '+%Y-%m-%d %H:%M %Z')" \
                -f "$W/parse.jq" "${files[@]}" < /dev/null > "$W/model.json"

          # log: řádky s "!" jako varování v Actions
          jq -r '.log[]' "$W/model.json" | sed 's/^! /::warning::/'
          jq -r '"Načteno: \(.sboms | length) SBOMů, \(.components | length) komponent"' "$W/model.json"

      # ------------------------------------------------------------------
      # 3) model.json -> statické HTML + CSV
      # ------------------------------------------------------------------
      - name: Vygeneruj HTML stránky
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP:-/tmp}/sbom"
          jq -c -f "$W/render.jq" "$W/model.json" > "$W/pages.jsonl"
          n=0
          while IFS= read -r line; do
            p="$(jq -r '.path' <<< "$line")"
            mkdir -p "$OUT/$(dirname "$p")"
            jq -j '.content' <<< "$line" > "$OUT/$p"
            n=$((n + 1))
          done < "$W/pages.jsonl"
          cp docs/style2.css "$OUT/style2.css"
          echo "Vygenerováno $n souborů do $OUT/"
          {
            echo "### SBOM knihovny"
            jq -r '"- SBOMů: \(.sboms | length)\n- komponent: \(.components | length)"' "$W/model.json"
            echo "- vygenerováno souborů: $n"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
